plugins {
    id 'java'
    id 'application'
}

group = 'net.spotifei'
version = '1.2'

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

// Configurações para cada plataforma específica
configurations {
    ffmpegLinuxArm64
    ffmpegLinuxX64
    ffmpegMacosArm64
    ffmpegMacosX64
    ffmpegWindowsX64
}

dependencies {
    // Dependências comuns
    implementation("com.google.code.gson:gson:2.10.1")
    implementation("commons-dbutils:commons-dbutils:1.7")
    implementation("io.github.cdimascio:dotenv-java:3.2.0")
    implementation("org.springframework.security:spring-security-crypto:5.8.16")
    implementation("commons-logging:commons-logging:1.3.0")
    implementation("org.postgresql:postgresql:42.7.5")
    implementation("org.slf4j:slf4j-api:2.0.17")
    implementation("org.apache.logging.log4j:log4j-slf4j2-impl:2.23.1")
    implementation("commons-io:commons-io:2.21.0")
    implementation("org.apache.logging.log4j:log4j-core:2.23.1")
    implementation("com.formdev:flatlaf:3.6")

    // JavaTube para download de vídeos do youtube
    implementation("com.github.felipeucelli:javatube:master-SNAPSHOT")

    // JavaCV comum
    implementation("org.bytedeco:javacv:1.5.10")
    implementation("org.bytedeco:ffmpeg:6.1.1-1.5.10")

    // Para desenvolvimento local - Windows 64-bit por padrão
    implementation("org.bytedeco:ffmpeg:6.1.1-1.5.10:windows-x86_64")

    // FFmpeg específico para cada plataforma
    ffmpegLinuxArm64("org.bytedeco:ffmpeg:6.1.1-1.5.10:linux-arm64")
    ffmpegLinuxX64("org.bytedeco:ffmpeg:6.1.1-1.5.10:linux-x86_64")
    ffmpegMacosArm64("org.bytedeco:ffmpeg:6.1.1-1.5.10:macosx-arm64")
    ffmpegMacosX64("org.bytedeco:ffmpeg:6.1.1-1.5.10:macosx-x86_64")
    ffmpegWindowsX64("org.bytedeco:ffmpeg:6.1.1-1.5.10:windows-x86_64")
}

application {
    mainClass = 'net.spotifei.Spotifei'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Função helper para obter dependências comuns (exceto FFmpeg específico)
def getCommonDependencies() {
    return configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts
            .findAll { artifact ->
                def id = artifact.moduleVersion.id
                // Excluir FFmpeg com classificadores específicos de plataforma
                !(id.group == 'org.bytedeco' && id.name == 'ffmpeg' &&
                        artifact.classifier && artifact.classifier != '')
            }
            .collect { it.file }
}

// Task para Linux ARM64
task jarLinuxArm64(type: Jar) {
    archiveBaseName = 'Spotify'
    archiveVersion = '1.2'
    archiveClassifier = 'linux-arm64'

    from sourceSets.main.output
    from getCommonDependencies().collect { it.isDirectory() ? it : zipTree(it) }
    from configurations.ffmpegLinuxArm64.collect { it.isDirectory() ? it : zipTree(it) }

    manifest {
        attributes(
                'Main-Class': 'net.spotifei.Spotifei',
                'Platform': 'linux-arm64'
        )
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

