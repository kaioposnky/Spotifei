// Task para construir todas as plataformas
task buildAllPlatforms {
    description = 'Constrói JARs para todas as plataformas suportadas'
    group = 'build'

    dependsOn 'jarLinuxArm64', 'jarLinuxX64', 'jarMacosArm64', 'jarMacosX64', 'jarWindowsX64'

    doLast {
        println "JARs criados:"
        println "  - Spotify-1.2-linux-arm64.jar"
        println "  - Spotify-1.2-linux-x64.jar"
        println "  - Spotify-1.2-macos-arm64.jar"
        println "  - Spotify-1.2-macos-x64.jar"
        println "  - Spotify-1.2-windows-x64.jar"
    }
}

// Task para limpar apenas os JARs de plataforma
task cleanPlatformJars(type: Delete) {
    description = 'Remove todos os JARs específicos de plataforma'
    group = 'build'

    delete fileTree(layout.buildDirectory.dir('libs')) {
        include 'Spotify-*-linux-*.jar'
        include 'Spotify-*-macos-*.jar'
        include 'Spotify-*-windows-*.jar'
    }
}

// Task para mostrar informações sobre as plataformas
task showPlatforms {
    description = 'Mostra todas as plataformas suportadas'
    group = 'help'

    doLast {
        println "Plataformas suportadas:"
        println "  - linux-arm64"
        println "  - linux-x64"
        println "  - macos-arm64"
        println "  - macos-x64"
        println "  - windows-x64"
        println ""
        println "Para construir uma plataforma específica:"
        println "  gradle jarLinuxArm64    # Linux ARM64"
        println "  gradle jarLinuxX64      # Linux x64"
        println "  gradle jarMacosArm64    # macOS Apple Silicon"
        println "  gradle jarMacosX64      # macOS Intel"
        println "  gradle jarWindowsX64    # Windows x64"
        println ""
        println "Para construir todas as plataformas:"
        println "  gradle buildAllPlatforms"
    }
}

// Configurar o JAR padrão para desenvolvimento
jar {
    archiveBaseName = 'Spotify'
    archiveVersion = '1.2'
    archiveClassifier = 'dev'

    manifest {
        attributes 'Main-Class': 'net.spotifei.Spotifei'
    }
    from configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Reconfigurar a task build para construir todos os JARs
build {
    dependsOn buildAllPlatforms
}